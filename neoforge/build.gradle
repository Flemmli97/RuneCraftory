plugins {
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version '2.+'
    id 'io.github.flemmli97.multiloader.platform-neoforge'
}

neoForge {
    runs {
        var common = project(":common")
        data {
            data()
            programArguments.addAll "--all", "--mod", "runecraftory"
            programArguments.addAll "--output", common.file("src/generated/resources").absolutePath
            programArguments.addAll "--existing", file("src/main/resources").absolutePath
            programArguments.addAll "--existing", common.file("src/main/resources").absolutePath
        }
        client {
            jvmArgument "-XX:+AllowEnhancedClassRedefinition"
        }
    }
}

ext {
    mod_meta.tenshilib_version = tenshilib_version
    mod_meta.sbl_version = sbl_version
}

configurations {
    datagenRuntime
}

afterEvaluate {
    runData {
        classpath += configurations.datagenRuntime
    }
}

repositories {
    maven {
        name = "minecolonies"
        url "https://ldtteam.jfrog.io/ldtteam/modding/"
        content {
            includeGroup 'com.ldtteam'
        }
    }
    maven {
        name = "The one probe"
        url "https://maven.k-4u.nl"
        content {
            includeGroup 'mcjty.theoneprobe'
        }
    }
}

dependencies {
    implementation "io.github.flemmli97:tenshilib:${tenshilib_version}-neoforge"
    implementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-${minecraft_version}:${sbl_version}"
    jarJar(implementation("io.github.flemmli97:simplequests_api:${simplequests_api_version}-neoforge"))

    implementation "net.favouriteless.modopedia:modopedia-neoforge-${minecraft_version}:${modopedia}"
    compileOnly "io.github.flemmli97:improvedmobs:1.21.1-1.14.2-neoforge"
    // Only want this for datagen
    datagenRuntime "io.github.flemmli97:improvedmobs:1.21.1-1.14.2-neoforge"

    // Jar-Jar not added otherwise
    runtimeOnly "io.github.flemmli97:lingua_bib:${lingua_bib}-neoforge"
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")

    compileOnly("mcjty.theoneprobe:theoneprobe:${top_version}")

    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
//    runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"

    compileOnly "com.ldtteam:minecolonies:${minecolonies}"

    runtimeOnly "maven.modrinth:jade:${jade_neoforge}"

    // Mods useful for testing things
    runtimeOnly "io.github.flemmli97:debugutils:1.21.1-1.0.8-neoforge"
    runtimeOnly "io.github.flemmli97:mobbattle:1.21.1-2.6.2-neoforge"
    runtimeOnly "curse.maven:moonlight-499980:6682378"
    runtimeOnly "curse.maven:dummy-225738:6608246"
    runtimeOnly "curse.maven:spark-361579:6225208"
}